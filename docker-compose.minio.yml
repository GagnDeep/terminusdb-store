# MinIO for the object-store backend integration tests (Milestone 5).
#
# Usage:
#   docker compose -f docker-compose.minio.yml up -d
#   # wait for the "createbucket" job to finish creating the bucket, then:
#   TDB_OBJECT_STORE_ENDPOINT=http://localhost:9100 \
#   TDB_OBJECT_STORE_BUCKET=terminusdb \
#   TDB_OBJECT_STORE_ACCESS_KEY_ID=minioadmin \
#   TDB_OBJECT_STORE_SECRET_ACCESS_KEY=minioadmin \
#   cargo test --features object-store -- --ignored --nocapture minio_
#   docker compose -f docker-compose.minio.yml down -v
#
# The S3 API is exposed on host port 9100 and the console on 9101 to avoid
# clashing with anything already bound to the default 9000/9001.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One-shot job that waits for MinIO and creates the test bucket.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/terminusdb &&
      echo 'bucket terminusdb ready'
      "
